<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เทศกาลอนิเมะฤดูร้อน 2026 (Anime Summer Festival 2026)</title>
<style>
    @page {
        size: A4;
        margin: 15mm 15mm;
        background-color: #0f0c20;
    }
    
    *, *::before, *::after {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: 'Sarabun', 'Prompt', sans-serif;
        color: #e2e8f0;
        background-color: #0f0c20;
        line-height: 1.6;
    }

    /* Banner / Hero */
    .hero {
        background: linear-gradient(135deg, #1e1b4b 0%, #311042 50%, #4c0519 100%);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 20px;
        border: 1px solid #6366f1;
        box-shadow: 0 10px 25px rgba(99, 102, 241, 0.2);
    }

    .hero-title {
        font-size: 24pt;
        font-weight: 800;
        color: #ffffff;
        margin: 0 0 8px 0;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .hero-subtitle {
        font-size: 13pt;
        color: #a5f3fc;
        margin: 0 0 12px 0;
        font-weight: 500;
    }

    .hero-meta-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }

    .hero-meta-td {
        background: rgba(255, 255, 255, 0.07);
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 10pt;
        color: #f1f5f9;
    }

    /* Section Styling */
    .section-title {
        font-size: 14pt;
        font-weight: bold;
        color: #38bdf8;
        border-left: 4px solid #818cf8;
        padding-left: 10px;
        margin: 20px 0 12px 0;
    }

    .grid-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 10px;
        margin-bottom: 10px;
    }

    .card {
        background-color: #1e1e38;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 14px;
        vertical-align: top;
    }

    .card-title {
        font-size: 11pt;
        font-weight: bold;
        color: #f472b6;
        margin-bottom: 6px;
    }

    .card-desc {
        font-size: 9.5pt;
        color: #cbd5e1;
    }

    /* Program Table */
    .schedule-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        background-color: #18182c;
        border-radius: 8px;
        overflow: hidden;
    }
